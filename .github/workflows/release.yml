name: Release

# Pushing a v* tag builds every platform and publishes a GitHub release.
# Running this manually builds and uploads the same artifacts as workflow artifacts, without
# creating a release — use that to check the packaging before committing to a tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The tag and <Version> must agree, or the release would ship assemblies stamped with a
      # different version than the tag advertises.
      - name: Resolve and check version
        id: version
        run: |
          set -euo pipefail
          props="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          if [ -z "$props" ]; then
            echo "::error::No <Version> found in Directory.Build.props"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$props" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match <Version>$props</Version>"
              exit 1
            fi
          fi
          echo "version=$props" >> "$GITHUB_OUTPUT"
          echo "Version: $props"

  # The headless tests exercise managed code only — no display, no X11 — so they run identically
  # everywhere. What they catch per-platform is the code that branches on the OS: file modes,
  # path handling, and the case sensitivity of the filesystem underneath.
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test ObjectStorageClient.sln --configuration Release --nologo

  package:
    name: Package ${{ matrix.rid }}
    needs: [verify, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      # macOS needs a real .app bundle, so it goes through the packaging script. The other two
      # platforms are a plain publish plus an archive.
      - name: Package (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: bash build/package-macos.sh "${{ matrix.rid }}" "${{ needs.verify.outputs.version }}" artifacts

      - name: Package (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          set -euo pipefail
          name="ObjectStorageClient-${{ needs.verify.outputs.version }}-${{ matrix.rid }}"
          dotnet publish src/ObjectStorageClient.App \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained \
            --output "staging/$name" \
            -p:Version="${{ needs.verify.outputs.version }}" \
            --nologo
          mkdir -p artifacts
          tar -czf "artifacts/$name.tar.gz" -C staging "$name"

      - name: Package (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "ObjectStorageClient-${{ needs.verify.outputs.version }}-${{ matrix.rid }}"
          dotnet publish src/ObjectStorageClient.App `
            --configuration Release `
            --runtime "${{ matrix.rid }}" `
            --self-contained `
            --output "staging/$name" `
            -p:Version="${{ needs.verify.outputs.version }}" `
            --nologo
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          Compress-Archive -Path "staging/$name" -DestinationPath "artifacts/$name.zip"

      # Start-up guards. The headless tests never touch X11, Win32 or AppKit, so they pass
      # happily while the shipped binary fails to open a window — which is exactly how a missing
      # libx11-6 survived in the documented dependency list. These launch the artifact we are
      # about to publish and fail if it does not stay up. An app that cannot start is not
      # something to hand to manual QA.

      # Deliberately a bare Debian image with only the packages the README tells users to
      # install, rather than the runner itself, which already has half of X11 present.
      - name: Smoke test (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          set -euo pipefail
          name="ObjectStorageClient-${{ needs.verify.outputs.version }}-${{ matrix.rid }}"
          docker run --rm -v "$PWD/staging/$name:/app:ro" debian:trixie-slim bash -eu -c '
            apt-get update -qq
            apt-get install -y -qq libx11-6 libice6 libsm6 libfontconfig1 xvfb > /dev/null
            xvfb-run -a /app/ObjectStorageClient.App &
            pid=$!
            sleep 15
            if ! kill -0 "$pid" 2> /dev/null; then
              wait "$pid" && rc=0 || rc=$?
              echo "The application exited during start-up (exit $rc)"
              exit 1
            fi
            kill "$pid"
            echo "Still running after 15s — start-up OK"
          '

      - name: Smoke test (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "ObjectStorageClient-${{ needs.verify.outputs.version }}-${{ matrix.rid }}"
          $app = Start-Process -FilePath "staging/$name/ObjectStorageClient.App.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "The application exited during start-up ($($app.ExitCode))" }
          $app.Kill()
          Write-Host 'Still running after 15s — start-up OK'

      # The packaging script keeps its bundle in a staging directory it deletes on exit, so this
      # unpacks the archive that actually ships — which also proves ditto preserved the
      # executable bit. osx-x64 is cross-architecture on an Apple Silicon runner and would need
      # Rosetta, so only the native slice is launched.
      - name: Smoke test (macOS)
        if: matrix.rid == 'osx-arm64'
        run: |
          set -euo pipefail
          archive="artifacts/ObjectStorageClient-${{ needs.verify.outputs.version }}-${{ matrix.rid }}.zip"
          rm -rf smoke && mkdir smoke
          ditto -x -k "$archive" smoke
          app="$(/usr/bin/find smoke -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::No .app bundle inside $archive"
            exit 1
          fi
          "$app/Contents/MacOS/ObjectStorageClient.App" &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2> /dev/null; then
            wait "$pid" && rc=0 || rc=$?
            echo "::error::The application exited during start-up (exit $rc)"
            exit 1
          fi
          kill "$pid"
          echo "Still running after 15s — start-up OK"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: [verify, package]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Collect artifacts and checksums
        run: |
          set -euo pipefail
          mkdir -p artifacts
          find downloaded -type f -exec mv {} artifacts/ \;
          cd artifacts
          sha256sum ObjectStorageClient-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          sed "s/@VERSION@/$VERSION/g" build/release-body.md > release-body.md
          gh release create "$GITHUB_REF_NAME" \
            --title "v$VERSION" \
            --notes-file release-body.md \
            --generate-notes \
            artifacts/*

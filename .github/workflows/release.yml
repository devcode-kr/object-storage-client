name: Release

# Pushing a v* tag builds every platform and publishes a GitHub release.
# Running this manually builds and uploads the same artifacts as workflow artifacts, without
# creating a release — use that to check the packaging before committing to a tag.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Check version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # The tag and <Version> must agree, or the release would ship assemblies stamped with a
      # different version than the tag advertises.
      - name: Resolve and check version
        id: version
        run: |
          set -euo pipefail
          props="$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)"
          if [ -z "$props" ]; then
            echo "::error::No <Version> found in Directory.Build.props"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$props" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match <Version>$props</Version>"
              exit 1
            fi
          fi
          echo "version=$props" >> "$GITHUB_OUTPUT"
          echo "Version: $props"

  # The headless tests exercise managed code only — no display, no X11 — so they run identically
  # everywhere. What they catch per-platform is the code that branches on the OS: file modes,
  # path handling, and the case sensitivity of the filesystem underneath.
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      - name: Test
        run: dotnet test ObjectStorageClient.sln --configuration Release --nologo

  package:
    name: Package ${{ matrix.rid }}
    needs: [verify, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
          - os: macos-latest
            rid: osx-x64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          global-json-file: global.json

      # macOS needs a real .app bundle, so it goes through the packaging script. The other two
      # platforms are a plain publish plus an archive.
      - name: Package (macOS)
        if: startsWith(matrix.rid, 'osx-')
        run: bash build/package-macos.sh "${{ matrix.rid }}" "${{ needs.verify.outputs.version }}" artifacts

      - name: Package (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          set -euo pipefail
          name="ObjectStorageClient-${{ needs.verify.outputs.version }}-${{ matrix.rid }}"
          dotnet publish src/ObjectStorageClient.App \
            --configuration Release \
            --runtime "${{ matrix.rid }}" \
            --self-contained \
            --output "staging/$name" \
            -p:Version="${{ needs.verify.outputs.version }}" \
            --nologo
          mkdir -p artifacts
          tar -czf "artifacts/$name.tar.gz" -C staging "$name"

      # Windows ships through the Microsoft Store, so this build exists to be smoke-tested and
      # to become an MSIX — it is not attached to the release. The Store re-signs the package
      # it accepts, which is why nothing here signs anything.
      - name: Publish (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "ObjectStorageClient-${{ needs.verify.outputs.version }}-${{ matrix.rid }}"
          dotnet publish src/ObjectStorageClient.App `
            --configuration Release `
            --runtime "${{ matrix.rid }}" `
            --self-contained `
            --output "staging/$name" `
            -p:Version="${{ needs.verify.outputs.version }}" `
            --nologo
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }

      # Start-up guards. The headless tests never touch X11, Win32 or AppKit, so they pass
      # happily while the shipped binary fails to open a window — which is exactly how a missing
      # libx11-6 survived in the documented dependency list. These launch the artifact we are
      # about to publish and fail if it does not stay up. An app that cannot start is not
      # something to hand to manual QA.

      # Deliberately a bare Debian image with only the packages the README tells users to
      # install, rather than the runner itself, which already has half of X11 present.
      - name: Smoke test (Linux)
        if: matrix.rid == 'linux-x64'
        run: |
          set -euo pipefail
          name="ObjectStorageClient-${{ needs.verify.outputs.version }}-${{ matrix.rid }}"
          docker run --rm -v "$PWD/staging/$name:/app:ro" debian:trixie-slim bash -eu -c '
            apt-get update -qq
            apt-get install -y -qq libx11-6 libice6 libsm6 libfontconfig1 xvfb > /dev/null
            xvfb-run -a /app/ObjectStorageClient.App &
            pid=$!
            sleep 15
            if ! kill -0 "$pid" 2> /dev/null; then
              wait "$pid" && rc=0 || rc=$?
              echo "The application exited during start-up (exit $rc)"
              exit 1
            fi
            kill "$pid"
            echo "Still running after 15s — start-up OK"
          '

      - name: Smoke test (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = "ObjectStorageClient-${{ needs.verify.outputs.version }}-${{ matrix.rid }}"
          $app = Start-Process -FilePath "staging/$name/ObjectStorageClient.App.exe" -PassThru
          Start-Sleep -Seconds 15
          if ($app.HasExited) { throw "The application exited during start-up ($($app.ExitCode))" }
          $app.Kill()
          Write-Host 'Still running after 15s — start-up OK'

      # The packaging script keeps its bundle in a staging directory it deletes on exit, so this
      # unpacks the archive that actually ships — which also proves ditto preserved the
      # executable bit. osx-x64 is cross-architecture on an Apple Silicon runner and would need
      # Rosetta, so only the native slice is launched.
      - name: Smoke test (macOS)
        if: matrix.rid == 'osx-arm64'
        run: |
          set -euo pipefail
          archive="artifacts/ObjectStorageClient-${{ needs.verify.outputs.version }}-${{ matrix.rid }}.zip"
          rm -rf smoke && mkdir smoke
          ditto -x -k "$archive" smoke
          app="$(/usr/bin/find smoke -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "::error::No .app bundle inside $archive"
            exit 1
          fi
          "$app/Contents/MacOS/ObjectStorageClient.App" &
          pid=$!
          sleep 15
          if ! kill -0 "$pid" 2> /dev/null; then
            wait "$pid" && rc=0 || rc=$?
            echo "::error::The application exited during start-up (exit $rc)"
            exit 1
          fi
          kill "$pid"
          echo "Still running after 15s — start-up OK"

      # The packaging script cannot run until Partner Center issues the identity values, which
      # would leave a typo in it undiscovered for weeks. Parsing costs nothing and finds that now.
      - name: Check the MSIX script parses
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/build/package-windows-msix.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host "::error::$($_.Extent.StartLineNumber): $($_.Message)" }
            throw "package-windows-msix.ps1 has syntax errors"
          }
          Write-Host 'package-windows-msix.ps1 parses'

      # Needs the three identity values from Partner Center, so it only runs once they are set as
      # repository variables. Until then the Windows leg still builds and smoke-tests.
      - name: Build MSIX for the Store
        if: matrix.rid == 'win-x64' && vars.MSIX_IDENTITY_NAME != ''
        shell: pwsh
        run: |
          build\package-windows-msix.ps1 `
            -IdentityName "${{ vars.MSIX_IDENTITY_NAME }}" `
            -Publisher "${{ vars.MSIX_PUBLISHER }}" `
            -PublisherDisplayName "${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}" `
            -Version "${{ needs.verify.outputs.version }}" `
            -OutputDir msix

      # Separate from the release assets: this goes to Partner Center by hand, not to the release.
      - name: Upload MSIX
        if: matrix.rid == 'win-x64' && vars.MSIX_IDENTITY_NAME != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: msix-store
          path: msix/*.msix
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: matrix.rid != 'win-x64'
        with:
          name: release-${{ matrix.rid }}
          path: artifacts/*
          if-no-files-found: error

  linux_packages:
    name: Validate Linux packages
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/linux-packages.yml
    with:
      version: ${{ needs.verify.outputs.version }}
      package_release: '1'

  # One-time repository setup: create the rhel-9-manual-validation environment with a required reviewer.
  # RHEL9_MANUAL_VALIDATION_VERSION is an environment variable, not a secret, and is
  # manually updated only after real subscribed RHEL 9 GUI, S3, and native package validation.
  # The tag-only guard leaves workflow_dispatch package-validation artifacts unblocked.
  rhel_release_gate:
    name: Confirm manual RHEL 9 validation
    needs: verify
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    environment: rhel-9-manual-validation
    steps:
      - name: Require the exact manually validated release version
        env:
          VALIDATED_VERSION: ${{ vars.RHEL9_MANUAL_VALIDATION_VERSION }}
        run: |
          set -euo pipefail
          [[ -n "$VALIDATED_VERSION" ]] || {
            echo "::error::RHEL 9 manual validation gate is not satisfied for this release."
            exit 1
          }
          [[ "$VALIDATED_VERSION" == "${{ needs.verify.outputs.version }}" ]] || {
            echo "::error::RHEL 9 manual validation gate is not satisfied for this release."
            exit 1
          }

  prepare_linux_repositories:
    name: Prepare signed Linux repositories
    needs: [verify, linux_packages, rhel_release_gate]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    uses: ./.github/workflows/publish-linux-repositories.yml
    with:
      mode: prepare
      version: ${{ needs.verify.outputs.version }}
      package_release: '1'
      validation_artifact: linux-package-validation
      candidate_artifact: linux-pages-candidate
    secrets:
      LINUX_REPO_GPG_PRIVATE_KEY: ${{ secrets.LINUX_REPO_GPG_PRIVATE_KEY }}
      LINUX_REPO_GPG_PASSPHRASE: ${{ secrets.LINUX_REPO_GPG_PASSPHRASE }}

  release:
    name: Publish release
    needs: [verify, package, linux_packages, prepare_linux_repositories]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # release-* only: the MSIX is uploaded separately and belongs in Partner Center, not here.
      - name: Download platform release archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: release-*
          path: downloaded/platform

      - name: Download signed Linux release packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: linux-release-packages
          path: downloaded/linux-release-packages

      - name: Verify and collect release artifacts
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          (
            cd downloaded/linux-release-packages
            sha256sum --check SHA256SUMS
          )

          mapfile -d '' sources < <(
            find downloaded/platform -type f \( -name '*.tar.gz' -o -name '*.zip' \) -print0
            find downloaded/linux-release-packages -maxdepth 1 -type f \( -name '*.deb' -o -name '*.rpm' \) -print0
          )
          declare -A source_by_basename=()
          actual=()
          for source in "${sources[@]}"; do
            basename="$(basename "$source")"
            if [[ -n "${source_by_basename[$basename]+present}" ]]; then
              printf 'duplicate release asset basename: %s\n' "$basename" >&2
              exit 1
            fi
            source_by_basename["$basename"]="$source"
            actual+=("$basename")
          done
          expected=(
            "ObjectStorageClient-${VERSION}-linux-x64.tar.gz"
            "ObjectStorageClient-${VERSION}-osx-arm64.zip"
            "ObjectStorageClient-${VERSION}-osx-x64.zip"
            "ObjectStorageClient-${VERSION}-1-linux-x64.deb"
            "ObjectStorageClient-${VERSION}-1-linux-x64.rpm"
          )
          mapfile -t actual_sorted < <(printf '%s\n' "${actual[@]}" | sort)
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          if [[ "${#actual_sorted[@]}" -ne "${#expected_sorted[@]}" ]] ||
              ! diff -u <(printf '%s\n' "${expected_sorted[@]}") <(printf '%s\n' "${actual_sorted[@]}"); then
            printf '%s\n' 'unexpected release asset set (missing or extra asset)' >&2
            exit 1
          fi

          test ! -e artifacts
          mkdir artifacts
          for basename in "${expected_sorted[@]}"; do
            source="${source_by_basename[$basename]}"
            destination="artifacts/$basename"
            test ! -e "$destination"
            mv -n -- "$source" "$destination"
            test ! -e "$source"
            test -f "$destination"
          done
          (
            cd artifacts
            mapfile -d '' assets < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%P\0' | sort -z)
            test "${#assets[@]}" -eq 5
            sha256sum -- "${assets[@]}" > SHA256SUMS.txt
            cat SHA256SUMS.txt
          )

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          STORE_URL: ${{ vars.STORE_URL }}
        run: |
          set -euo pipefail
          python3 - "$VERSION" "${STORE_URL:-}" <<'PY'
          import pathlib
          import sys

          version, store_url = sys.argv[1:]
          template = pathlib.Path('build/release-body.md').read_text(encoding='utf-8')
          rendered = (
              template.replace('@VERSION@', version)
              .replace('@STORE_URL_KO@', store_url or '아직 공개되지 않았다')
              .replace('@STORE_URL_EN@', store_url or 'Not published yet')
          )
          if '@VERSION@' in rendered or '@STORE_URL_' in rendered:
              raise SystemExit('release body contains an unresolved token')
          pathlib.Path('release-body.md').write_text(rendered, encoding='utf-8')
          PY
          gh release create "$GITHUB_REF_NAME" \
            --title "v$VERSION" \
            --notes-file release-body.md \
            --generate-notes \
            artifacts/*

  publish_linux_repositories:
    name: Publish signed Linux repositories
    needs: [release, prepare_linux_repositories, verify]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v') && needs.release.result == 'success'
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-linux-repositories.yml
    with:
      mode: publish
      version: ${{ needs.verify.outputs.version }}
      package_release: '1'
      validation_artifact: linux-package-validation
      candidate_artifact: linux-pages-candidate
    secrets:
      LINUX_REPO_GPG_PRIVATE_KEY: ${{ secrets.LINUX_REPO_GPG_PRIVATE_KEY }}
      LINUX_REPO_GPG_PASSPHRASE: ${{ secrets.LINUX_REPO_GPG_PASSPHRASE }}
